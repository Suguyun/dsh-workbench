# ── dsh 全局设置（已脱敏）────────────────────────────────────────────────────
#
# 注意：这**不是** profile 的一部分。settings.yaml 是 dsh 的全局设置，位置是
# ~/.dsh/settings.yaml。克隆本仓库不会自动生效，`bootstrap.sh` 在你不给
# --settings 时也不会碰它 —— 要用请自己合并需要的段落。
#
# 已脱敏：provider 名、apiKeyEnv、baseURL 全部换成了占位符。照抄连不上任何模型，
# 必须改成你自己的 provider。模型 id 与上下文/输出上限保持原值。
#
# 真正的 key 不在这个文件里：见 credentials.example.env。

ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1

llm-pi-ai:
  providers:
    custom-anthropic:
      displayName: custom-anthropic
      # key 从这个环境变量读；值放 ~/.dsh/.env 或进程环境
      apiKeyEnv: CUSTOM_API_KEY
      api: anthropic-messages
      baseURL: https://your-llm-endpoint.example.com
      models:
        - id: deepseek-v4.1-flash
          name: deepseek-v4.1-flash
          input:
            - text
            - image
          contextWindow: 1000000
          maxTokens: 1000000

agent-presets:
  default: cordis

agent-default-model:
  provider: custom-anthropic
  model: deepseek-v4.1-flash

catppuccin:
  flavor: off
  glass:
    enabled: true
    mode: compat
    blur: 12
    frost: 45
    brightness: 50
  autoCheck: true
  updateChannel: latest
  overrides: {}
  shikiStyle: italic-comments

ui-theme:
  preference: light
  fontSize: 17

# ⚠️ 安全相关：默认审批策略 = 全权限放行（工具调用不再逐次询问）。
#
# 这是本机原本的设置，为了忠实迁移而保留原值。新机器上如果你不希望工具默认
# 无审批执行，把 defaultPreset 改成 ask，或者整段删掉走默认值。
permission:
  defaultPreset: danger-full-access
